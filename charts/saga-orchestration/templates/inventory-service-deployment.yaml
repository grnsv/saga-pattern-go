apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "saga-orchestration.fullname" . }}-inventory-service
  labels:
    {{- include "saga-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/name: inventory-service
spec:
  replicas: {{ .Values.inventoryService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        {{- include "saga-orchestration.kafkaWaitTopicsContainer" . | nindent 8 }}
      containers:
        - name: inventory-service
          image: "{{ .Values.inventoryService.image }}:{{ .Values.inventoryService.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.inventoryService.port }}
          envFrom:
            - configMapRef:
                name: {{ include "saga-orchestration.fullname" . }}-config
          env:
            - name: HTTP_PORT
              value: {{ .Values.inventoryService.port | quote }}
            - name: SUCCESS_RATE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "saga-orchestration.fullname" . }}-config
                  key: INVENTORY_SUCCESS_RATE
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.inventoryService.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
