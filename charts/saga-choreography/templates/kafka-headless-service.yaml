apiVersion: v1
kind: Service
metadata:
  name: {{ include "saga-choreography.fullname" . }}-kafka-headless
  labels:
    {{- include "saga-choreography.labels" . | nindent 4 }}
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
