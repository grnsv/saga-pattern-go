apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "saga-choreography.fullname" . }}-kafka-init
  labels:
    {{- include "saga-choreography.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: "{{ .Values.kafka.image }}:{{ .Values.kafka.tag }}"
          command:
            - bash
            - -c
            - |
              BROKER={{ include "saga-choreography.kafkaBrokers" . }}
              echo "Waiting for Kafka at $BROKER..."
              until /opt/kafka/bin/kafka-broker-api-versions.sh \
                    --bootstrap-server "$BROKER" > /dev/null 2>&1; do
                echo "  not ready, retrying in 2s..."
                sleep 2
              done
              echo "Kafka ready. Creating topics..."
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" \
                --create --if-not-exists --topic order-events     --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" \
                --create --if-not-exists --topic payment-events   --partitions 1 --replication-factor 1
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BROKER" \
                --create --if-not-exists --topic inventory-events --partitions 1 --replication-factor 1
              echo "All topics ready."
