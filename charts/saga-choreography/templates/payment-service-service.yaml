apiVersion: v1
kind: Service
metadata:
  name: {{ include "saga-choreography.fullname" . }}-payment-service
  labels:
    {{- include "saga-choreography.labels" . | nindent 4 }}
    app.kubernetes.io/name: payment-service
spec:
  selector:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.paymentService.port }}
  type: ClusterIP
