global:
  # Override Kafka broker address; defaults to <release>-kafka:9092
  kafkaBrokers: ""

kafka:
  image: apache/kafka
  tag: "4.2.0"
  replicaCount: 1
  clusterId: "4L6g3nShT-eMCtK--X86sw"
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

orderService:
  image: order-service
  tag: latest
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

paymentService:
  image: payment-service
  tag: latest
  replicaCount: 1
  port: 8080
  successRate: "0.8"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

inventoryService:
  image: inventory-service
  tag: latest
  replicaCount: 1
  port: 8080
  successRate: "0.8"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

jaeger:
  image: jaegertracing/all-in-one
  tag: "1.76.0"
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
