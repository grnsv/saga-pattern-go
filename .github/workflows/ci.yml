name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - name: Run golangci-lint on all modules
        run: |
          modules=$(find . -name 'go.mod' ! -path './go.mod' -exec dirname {} \; | sort)
          for mod in $modules; do
            echo "=> lint $mod"
            (cd "$mod" && golangci-lint run ./...)
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests on all modules
        run: |
          modules=$(find . -name 'go.mod' ! -path './go.mod' -exec dirname {} \; | sort)
          for mod in $modules; do
            echo "=> test $mod"
            (cd "$mod" && go test -race ./...)
          done
