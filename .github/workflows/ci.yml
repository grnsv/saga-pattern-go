name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Check generated sqlc code
        run: |
          cd orchestration/saga-orchestrator
          go tool sqlc generate
          git diff --exit-code -- internal/store/db
      - name: Run golangci-lint on all modules
        run: |
          golangci_lint=$(go tool -n golangci-lint)
          modules=$(find . -name 'go.mod' ! -path './go.mod' ! -path '*/integration_test/go.mod' -exec dirname {} \; | sort)
          for mod in $modules; do
            echo "=> lint $mod"
            (cd "$mod" && "$golangci_lint" run ./...)
          done
          echo "=> lint ./choreography/integration_test"
          (cd choreography/integration_test && "$golangci_lint" run --build-tags integration ./...)

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run tests on all modules
        run: |
          modules=$(find . -name 'go.mod' ! -path './go.mod' ! -path '*/integration_test/go.mod' -exec dirname {} \; | sort)
          for mod in $modules; do
            echo "=> test $mod"
            (cd "$mod" && go test -race ./...)
          done
