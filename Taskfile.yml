version: "3"

vars:
  BIN_DIR: "{{.ROOT_DIR}}/.bin"
  MODULES:
    sh: find . -name 'go.mod' ! -path './go.mod' ! -path '*/integration_test/go.mod' -exec dirname {} \; | sort

tasks:
  default:
    silent: true
    cmds:
      - task --list

  generate:
    desc: Generate code
    cmds:
      - task: sqlc:generate

  sqlc:generate:
    desc: Generate sqlc code for saga-orchestrator
    cmds:
      - cd orchestration/saga-orchestrator && go tool sqlc generate

  fmt:
    desc: Format code via golangci-lint fmt
    aliases: [format]
    deps: [tools]
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> fmt {{.ITEM}}" && cd "{{.ITEM}}" && "{{.BIN_DIR}}/golangci-lint" fmt ./...
      - echo "=> fmt ./choreography/integration_test" && cd choreography/integration_test && "{{.BIN_DIR}}/golangci-lint" fmt ./...

  lint:
    desc: Run golangci-lint on all modules
    deps: [tools]
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> lint {{.ITEM}}" && cd "{{.ITEM}}" && "{{.BIN_DIR}}/golangci-lint" run ./...
      - echo "=> lint ./choreography/integration_test" && cd choreography/integration_test && "{{.BIN_DIR}}/golangci-lint" run --build-tags integration ./...

  test:
    desc: Run tests across all modules
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> test {{.ITEM}}" && cd "{{.ITEM}}" && go test -race ./...

  test:integration:
    desc: Run integration tests (requires Docker)
    cmds:
      - echo "=> test choreography/integration_test" && cd choreography/integration_test && go test -v -race -timeout 5m -tags integration ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> test {{.ITEM}}" && cd "{{.ITEM}}" && go test -race -coverprofile=coverage.out ./...

  build:
    desc: Build all services
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> build {{.ITEM}}" && cd "{{.ITEM}}" && CGO_ENABLED=0 go build -o /dev/null ./cmd/...

  up:
    desc: Start choreography stack with Docker Compose
    cmds:
      - docker compose up -d --build

  down:
    desc: Stop choreography stack
    cmds:
      - docker compose down

  logs:
    desc: Tail logs from all choreography services
    cmds:
      - docker compose logs -f

  create-order:
    desc: Create a test order via the order-service HTTP API
    cmds:
      - curl -s -X POST http://localhost:8080/orders -d '{"item":"widget","qty":1}' | jq .

  smoke-test:
    desc: Run choreography smoke test (starts stack, creates order, verifies saga completes)
    cmds:
      - task: up
      - task: _smoke
      - task: down

  orch-up:
    desc: Start orchestration stack with Docker Compose
    cmds:
      - docker compose -f docker-compose.orchestration.yml up -d --build

  orch-down:
    desc: Stop orchestration stack and remove volumes
    cmds:
      - docker compose -f docker-compose.orchestration.yml down -v

  orch-logs:
    desc: Tail logs from all orchestration services
    cmds:
      - docker compose -f docker-compose.orchestration.yml logs -f

  orch-create-order:
    desc: Create a test order via the orchestration order-api HTTP API
    cmds:
      - curl -s -X POST http://localhost:8080/orders -d '{"item":"widget","qty":1}' | jq .

  orch-saga-status:
    desc: Get saga status from saga-orchestrator; pass CORRELATION_ID=<order id>
    requires:
      vars: [CORRELATION_ID]
    cmds:
      - curl -s "http://localhost:8081/sagas/{{.CORRELATION_ID}}" | jq .

  orch-smoke-test:
    desc: Run orchestration smoke test (starts stack, creates order, verifies saga completes)
    cmds:
      - task: orch-up
      - task: _orch-smoke
      - task: orch-down

  orch-minikube-start:
    desc: Start Minikube cluster for orchestration
    cmds:
      - task: minikube-start

  orch-minikube-build:
    desc: Build orchestration Docker images inside Minikube Docker daemon
    cmds:
      - |
        eval $(minikube docker-env)
        docker build -t saga-order-api:latest        ./orchestration/order-api
        docker build -t saga-orchestrator:latest     ./orchestration/saga-orchestrator
        docker build -t saga-payment-service:latest  ./orchestration/payment-service
        docker build -t saga-inventory-service:latest ./orchestration/inventory-service

  orch-minikube-up:
    desc: Build orchestration images and install Helm chart in Minikube
    cmds:
      - task: orch-minikube-start
      - task: orch-minikube-build
      - helm upgrade --install saga-orch ./charts/saga-orchestration --namespace saga-pattern --create-namespace

  orch-minikube-down:
    desc: Uninstall orchestration Helm chart from Minikube
    cmds:
      - helm uninstall saga-orch --namespace saga-pattern

  orch-minikube-order:
    desc: Port-forward orchestration order-api to http://localhost:8080
    cmds:
      - kubectl port-forward -n saga-pattern svc/saga-orch-order-api 8080:80

  orch-minikube-saga:
    desc: Port-forward saga-orchestrator to http://localhost:8081
    cmds:
      - kubectl port-forward -n saga-pattern svc/saga-orch-saga-orchestrator 8081:80

  _smoke:
    internal: true
    cmds:
      - |
        echo "Waiting for order-service to be ready..."
        for i in $(seq 1 24); do
          curl -sf http://localhost:8080/healthz > /dev/null 2>&1 && break
          echo "  attempt $i/24, retrying in 5s..."
          sleep 5
        done
        echo "Creating order..."
        RESP=$(curl -s -X POST http://localhost:8080/orders -d '{"item":"widget","qty":1}')
        ORDER_ID=$(echo "$RESP" | jq -r '.id')
        echo "Created order: $ORDER_ID"
        echo "Waiting for saga to complete..."
        for i in $(seq 1 30); do
          STATUS=$(curl -s "http://localhost:8080/orders/$ORDER_ID" | jq -r '.status')
          if [ "$STATUS" = "CONFIRMED" ] || [ "$STATUS" = "CANCELLED" ]; then
            echo "PASS: saga completed ($STATUS)"
            exit 0
          fi
          echo "  attempt $i/30, status=$STATUS, retrying in 1s..."
          sleep 1
        done
        echo "FAIL: saga did not complete within 30s (last status: $STATUS)"
        exit 1

  _orch-smoke:
    internal: true
    cmds:
      - |
        echo "Waiting for orchestration APIs to be ready..."
        for i in $(seq 1 36); do
          ORDER_READY=0
          SAGA_READY=0
          curl -sf http://localhost:8080/healthz > /dev/null 2>&1 && ORDER_READY=1
          curl -sf http://localhost:8081/healthz > /dev/null 2>&1 && SAGA_READY=1
          if [ "$ORDER_READY" = "1" ] && [ "$SAGA_READY" = "1" ]; then
            break
          fi
          echo "  attempt $i/36, retrying in 5s..."
          sleep 5
        done
        echo "Creating order..."
        RESP=$(curl -s -X POST http://localhost:8080/orders -d '{"item":"widget","qty":1}')
        ORDER_ID=$(echo "$RESP" | jq -r '.id')
        if [ -z "$ORDER_ID" ] || [ "$ORDER_ID" = "null" ]; then
          echo "FAIL: could not create order"
          echo "$RESP"
          exit 1
        fi
        echo "Created order: $ORDER_ID"
        echo "Waiting for saga to complete..."
        for i in $(seq 1 45); do
          STATUS=$(curl -s "http://localhost:8080/orders/$ORDER_ID" | jq -r '.status')
          if [ "$STATUS" = "CONFIRMED" ] || [ "$STATUS" = "CANCELLED" ]; then
            echo "PASS: saga completed ($STATUS)"
            curl -s "http://localhost:8081/sagas/$ORDER_ID" | jq .
            exit 0
          fi
          echo "  attempt $i/45, status=$STATUS, retrying in 1s..."
          sleep 1
        done
        echo "FAIL: saga did not complete within 45s (last status: $STATUS)"
        curl -s "http://localhost:8081/sagas/$ORDER_ID" | jq . || true
        exit 1

  tools:
    desc: Install development tools
    internal: true
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
    sources:
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/golangci-lint"

  minikube-start:
    desc: Start Minikube cluster
    cmds:
      - minikube start --driver=docker --extra-config=kubelet.cgroup-driver=systemd

  minikube-delete:
    desc: Delete Minikube cluster
    cmds:
      - minikube delete

  minikube-build:
    desc: Build Docker images inside Minikube Docker daemon
    cmds:
      - |
        eval $(minikube docker-env)
        docker build -t order-service:latest     ./choreography/order-service
        docker build -t payment-service:latest   ./choreography/payment-service
        docker build -t inventory-service:latest ./choreography/inventory-service

  minikube-up:
    desc: Build images and install Helm chart in Minikube
    cmds:
      - task: minikube-start
      - task: minikube-build
      - helm upgrade --install saga-choreo ./charts/saga-choreography --namespace saga-pattern --create-namespace

  minikube-down:
    desc: Uninstall Helm chart from Minikube
    cmds:
      - helm uninstall saga-choreo --namespace saga-pattern

  minikube-jaeger:
    desc: Port-forward Jaeger UI to http://localhost:16686
    cmds:
      - kubectl port-forward -n saga-pattern svc/saga-choreo-jaeger 16686:16686

  minikube-order:
    desc: Port-forward order-service API to http://localhost:8080
    cmds:
      - kubectl port-forward -n saga-pattern svc/saga-choreo-order-service 8080:80

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - find . -name 'coverage.out' -delete
