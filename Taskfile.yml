version: "3"

vars:
  BIN_DIR: "{{.ROOT_DIR}}/.bin"
  MODULES:
    sh: find . -name 'go.mod' ! -path './go.mod' -exec dirname {} \; | sort

tasks:
  default:
    silent: true
    cmds:
      - task --list

  fmt:
    desc: Format code via golangci-lint fmt
    aliases: [format]
    deps: [tools]
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> fmt {{.ITEM}}" && cd "{{.ITEM}}" && "{{.BIN_DIR}}/golangci-lint" fmt ./...

  lint:
    desc: Run golangci-lint on all modules
    deps: [tools]
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> lint {{.ITEM}}" && cd "{{.ITEM}}" && "{{.BIN_DIR}}/golangci-lint" run ./...

  test:
    desc: Run tests across all modules
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> test {{.ITEM}}" && cd "{{.ITEM}}" && go test -race ./...

  test:cover:
    desc: Run tests with coverage
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> test {{.ITEM}}" && cd "{{.ITEM}}" && go test -race -coverprofile=coverage.out ./...

  build:
    desc: Build all services
    cmds:
      - for: { var: MODULES }
        cmd: echo "=> build {{.ITEM}}" && cd "{{.ITEM}}" && CGO_ENABLED=0 go build -o /dev/null ./cmd/...

  up:
    desc: Start choreography stack with Docker Compose
    cmds:
      - docker compose up -d

  down:
    desc: Stop choreography stack
    cmds:
      - docker compose down

  logs:
    desc: Tail logs from all choreography services
    cmds:
      - docker compose logs -f

  create-order:
    desc: Create a test order via the order-service HTTP API
    cmds:
      - curl -s -X POST http://localhost:8080/orders -d '{"item":"widget","qty":1}' | jq .

  smoke-test:
    desc: Run choreography smoke test (starts stack, creates order, verifies saga completes)
    cmds:
      - task: up
      - task: _smoke
      - task: down

  _smoke:
    internal: true
    cmds:
      - |
        echo "Waiting for order-service to be ready..."
        for i in $(seq 1 24); do
          curl -sf http://localhost:8080/healthz > /dev/null 2>&1 && break
          echo "  attempt $i/24, retrying in 5s..."
          sleep 5
        done
        echo "Creating order..."
        RESP=$(curl -s -X POST http://localhost:8080/orders -d '{"item":"widget","qty":1}')
        ORDER_ID=$(echo "$RESP" | jq -r '.id')
        echo "Created order: $ORDER_ID"
        echo "Waiting for saga to complete..."
        for i in $(seq 1 30); do
          STATUS=$(curl -s "http://localhost:8080/orders/$ORDER_ID" | jq -r '.status')
          if [ "$STATUS" = "CONFIRMED" ] || [ "$STATUS" = "CANCELLED" ]; then
            echo "PASS: saga completed ($STATUS)"
            exit 0
          fi
          echo "  attempt $i/30, status=$STATUS, retrying in 1s..."
          sleep 1
        done
        echo "FAIL: saga did not complete within 30s (last status: $STATUS)"
        exit 1

  tools:
    desc: Install development tools
    internal: true
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint
    sources:
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/golangci-lint"

  minikube-start:
    desc: Start Minikube cluster
    cmds:
      - minikube start

  minikube-delete:
    desc: Delete Minikube cluster
    cmds:
      - minikube delete

  minikube-build:
    desc: Build Docker images inside Minikube Docker daemon
    cmds:
      - |
        eval $(minikube docker-env)
        docker build -t order-service:latest     ./choreography/order-service
        docker build -t payment-service:latest   ./choreography/payment-service
        docker build -t inventory-service:latest ./choreography/inventory-service

  minikube-up:
    desc: Build images and install Helm chart in Minikube
    cmds:
      - task: minikube-start
      - task: minikube-build
      - helm upgrade --install saga-choreo ./charts/saga-choreography --namespace saga-pattern --create-namespace

  minikube-down:
    desc: Uninstall Helm chart from Minikube
    cmds:
      - helm uninstall saga-choreo --namespace saga-pattern

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - find . -name 'coverage.out' -delete
