version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - cyclop
    - dupl
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - goconst
    - gocritic
    - mirror
    - misspell
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    cyclop:
      max-complexity: 20

    dupl:
      threshold: 150

    errcheck:
      check-type-assertions: true

    exhaustive:
      default-signifies-exhaustive: true

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

    nestif:
      min-complexity: 5

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      rules:
        - name: unexported-return
          disabled: true

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - goconst
          - gocritic
          - cyclop
          - funlen

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/grnsv/saga-pattern-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
